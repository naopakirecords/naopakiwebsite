# Pages CMS configuration: https://pagescms.org/docs/configuration/
# This file defines the editor at app.pagescms.org. You don't need to touch it to edit content.

settings:
  commit:
    identity: app
    templates:
      create: "Add {path} (via Pages CMS)"
      update: "Update {path} (via Pages CMS)"
      delete: "Delete {path} (via Pages CMS)"
      rename: "Rename {oldPath} to {newPath} (via Pages CMS)"

media:
  - name: work
    label: Project photos
    input: assets/img/work
    output: /assets/img/work
    rename: safe
    extensions: [jpg, jpeg, png, webp]
  - name: slideshow
    label: Homepage slideshow
    input: assets/img/hero
    output: /assets/img/hero
    rename: safe
    extensions: [jpg, jpeg, png, webp]
  - name: videos
    label: Video files (small clips only)
    input: assets/video
    output: /assets/video
    rename: safe
    extensions: [mp4, webm]
  - name: audio
    label: Sound
    input: assets/audio
    output: /assets/audio
    rename: safe
    extensions: [mp3, m4a, ogg]

content:
  - name: projects
    label: Projects
    type: file
    path: content/projects.json
    format: json
    list: true
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: type
        label: Type
        type: select
        description: Used by the All / Photo / Video filter.
        options:
          values: [PHOTO, VIDEO]
      - name: year
        label: Year
        type: string
      - name: line
        label: One short line
        type: string
        description: Optional. Keep it short.
      - name: cover
        label: Cover image
        type: image
        description: Shown in the work list and grid. If empty, the first photo below is used.
        options:
          media: work
      - name: media
        label: Photos & videos (shown top to bottom when the project opens)
        description: Fill in ONE box per item. Tall photos pair up side by side automatically.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{image}{video_link}{video_file}"
        fields:
          - name: image
            label: Photo
            type: image
            options:
              media: work
          - name: video_link
            label: OR YouTube / Vimeo link
            type: string
            description: Paste the full link, e.g. https://youtu.be/... or https://vimeo.com/...
          - name: video_file
            label: OR small video file (mp4, under ~20 MB)
            type: file
            description: Prefer YouTube/Vimeo for anything longer than a short clip.
            options:
              media: videos

  - name: site
    label: Homepage, About & Contact
    type: file
    path: content/site.json
    format: json
    fields:
      - name: slideshow
        label: Homepage slideshow (behind the logo)
        type: object
        fields:
          - name: images
            label: Slideshow images
            type: image
            description: Shown in this order, then loops. Landscape JPGs about 2000 px wide, under ~500 KB.
            options:
              media: slideshow
              multiple:
                max: 20
          - name: seconds
            label: Seconds per image
            type: number
          - name: black_and_white
            label: Show in black & white
            type: boolean
      - name: top_bar
        label: Top bar (logo + menu at the top)
        type: object
        fields:
          - name: darkness
            label: Darkness (0 = fully see-through, 100 = solid black)
            type: number
            description: Default 45.
            options:
              min: 0
              max: 100
          - name: blur
            label: Blur what's behind it
            type: boolean
      - name: texts
        label: Small texts (labels, marquee, footer)
        description: "These symbols show dimmed automatically: / † ✝ ✕ ⛧ ·  Leave a box empty to keep the built-in text."
        type: object
        fields:
          - name: top_bar_middle
            label: Top bar, middle (hidden on phones)
            type: string
          - name: hero_tagline
            label: Line under the logo
            type: string
          - name: hero_corner_left
            label: Bottom-left corner of the homepage
            type: string
            description: "{count} is replaced by the number of projects, e.g. † 008"
          - name: hero_corner_right
            label: Bottom-right corner (scrolls down to Work)
            type: string
          - name: marquee
            label: Scrolling strip text
            type: string
            description: Repeats endlessly. End it with a separator, e.g. "NO RULES † NO SHINE †"
          - name: footer_line
            label: Footer line
            type: string
      - name: about
        label: About
        type: object
        fields:
          - name: statement
            label: Statement
            type: text
            description: Wrap a word in *stars* to make it italic.
          - name: we_make
            label: "Column: We make"
            type: text
          - name: status
            label: "Column: Status"
            type: text
          - name: approach
            label: "Column: Approach"
            type: text
          - name: background_word
            label: Giant background word
            type: string
            description: Huge outlined word cropped behind the About section. Leave empty to hide. Don't use the brand name here, as the logo is only ever the SVG (the site ignores it).
          - name: background_word_style
            label: Giant word font
            type: select
            options:
              values:
                - { name: gothic, label: Gothic (Pirata One) }
                - { name: sans, label: Bold sans (Helvetica) }
      - name: contact
        label: Contact
        type: object
        fields:
          - name: email
            label: Email
            type: string
          - name: instagram
            label: Instagram
            type: object
            fields:
              - { name: handle, label: Handle, type: string }
              - { name: link, label: Link (leave empty to hide), type: string }
          - name: tiktok
            label: TikTok
            type: object
            fields:
              - { name: handle, label: Handle, type: string }
              - { name: link, label: Link (leave empty to hide), type: string }
          - name: youtube
            label: YouTube
            type: object
            fields:
              - { name: handle, label: Handle, type: string }
              - { name: link, label: Link (leave empty to hide), type: string }
      - name: sound
        label: Sound (optional)
        description: A looping track visitors can switch on from the top bar ("Sound [Off]"). It never plays by itself. Leave the file empty to hide the button.
        type: object
        fields:
          - name: enabled
            label: Show the sound button
            type: boolean
          - name: file
            label: Sound file (mp3, keep it under ~5 MB)
            type: file
            options:
              media: audio
          - name: volume
            label: Volume (0-100)
            type: number
            options:
              min: 0
              max: 100

  - name: look
    label: Look & effects
    type: file
    path: content/look.json
    format: json
    fields:
      - name: slideshow_transition
        label: Slideshow change
        type: select
        options:
          values:
            - { name: flash, label: Hard cut + camera flash }
            - { name: cut, label: Hard cut }
            - { name: fade, label: Soft fade }
      - name: slideshow_contrast
        label: Slideshow contrast
        type: select
        options:
          values:
            - { name: crushed, label: Crushed (harsh flash look) }
            - { name: normal, label: Normal }
      - name: photo_tone
        label: Photo tone when hovering projects
        type: select
        description: The floating preview in the list, and covers in the grid on hover.
        options:
          values:
            - { name: crushed, label: Crushed black & white }
            - { name: bw, label: Black & white }
            - { name: natural, label: Original colours }
      - name: grain
        label: Film grain
        type: select
        options:
          values:
            - { name: strong, label: Strong }
            - { name: subtle, label: Subtle }
            - { name: "off", label: "Off" }
      - name: scanlines
        label: Scan lines + VHS tracking band
        type: boolean
      - name: logo_glitch
        label: Logo glitch every few seconds
        type: boolean
      - name: hover_glitch
        label: Glitchy hover on project titles
        type: boolean
      - name: gothic_headings
        label: Gothic section titles (Work / About / Contact in Pirata One)
        type: boolean
      - name: cursor
        label: Mouse cursor
        type: select
        options:
          values:
            - { name: crosshair, label: Crosshair }
            - { name: default, label: Normal arrow }
      - name: intro
        label: Black-screen intro (seal flickers on)
        type: select
        options:
          values:
            - { name: first-visit, label: First visit only }
            - { name: every-visit, label: Every visit }
            - { name: "off", label: "Off" }
